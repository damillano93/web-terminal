name: WebTerminal
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Filled in by scripts/ios-build.sh from the Apple ID signed into Xcode.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  WebTerminal:
    type: application
    platform: iOS
    sources: [WebTerminal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webterminal
        INFOPLIST_FILE: WebTerminal/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
