name: WebTerminal
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Filled in by scripts/ios-build.sh from the Apple ID signed into Xcode.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  WebTerminal:
    type: application
    platform: iOS
    sources: [WebTerminal]
    settings:
      base:
        # Placeholder: the build scripts pass your WT_BUNDLE_ID from ios/local.env.
        PRODUCT_BUNDLE_IDENTIFIER: com.example.webterminal
        INFOPLIST_FILE: WebTerminal/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2,6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Mac (Catalyst): same app, Mac idiom, named apart from Apple's Terminal.
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        WT_DISPLAY_NAME: Terminal
        # The server the app opens. Not set here: the build scripts ask for it
        # on the first run, keep it in ios/local.env (git-ignored) and pass it
        # to xcodebuild. Both can also be changed in the app's Settings.
        WT_SERVER_URL: ""
        WT_LAN_URL: ""
        "WT_DISPLAY_NAME[sdk=macosx*]": Web Terminal
