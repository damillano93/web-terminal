<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>web-terminal · sign in</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233fb950' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='2' y='3' width='20' height='18' rx='2.2'/><polyline points='7 9 11 13 7 17'/><line x1='13' y1='17' x2='17' y2='17'/></svg>" />
<style>
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #7d8590; --border: #30363d;
    --accent: #2f81f7; --accent-hover: #1f6feb; --error: #f85149;
    --btn-bg: #ffffff; --btn-fg: #1f1f1f; --btn-bg-hover: #f7f7f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(400px, 92vw);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 32px 28px; background: #0d1117;
    box-shadow: 0 8px 28px rgba(0,0,0,.45); text-align: center;
  }
  .icon { font-family: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, monospace; font-size: 1.8em; color: #3fb950; margin-bottom: 4px; }
  h1 { margin: 0 0 6px 0; font-size: 1.25em; font-weight: 600; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.9em; margin-bottom: 26px; line-height: 1.4; }
  .sub b { color: var(--fg); font-weight: 600; }
  .google-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 12px; width: 100%;
    background: var(--btn-bg); color: var(--btn-fg); border: 0; border-radius: 8px;
    padding: 11px 14px; font-size: 0.95em; font-weight: 500; font-family: inherit;
    cursor: pointer; text-decoration: none; transition: background 120ms ease, transform 80ms ease;
  }
  .google-btn:hover { background: var(--btn-bg-hover); }
  .google-btn:active { transform: translateY(1px); }
  .google-btn svg { width: 18px; height: 18px; flex: 0 0 18px; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.78em; margin: 18px 0; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  form.pw { display: flex; flex-direction: column; gap: 10px; }
  form.pw input {
    width: 100%; background: #0b0e14; color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px;
    font-size: 0.95em; font-family: inherit;
  }
  form.pw input:focus { outline: none; border-color: var(--accent); }
  form.pw button {
    width: 100%; background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 11px 14px; font-size: 0.95em; font-weight: 500; font-family: inherit; cursor: pointer;
    transition: background 120ms ease;
  }
  form.pw button:hover { background: var(--accent-hover); }
  .err {
    margin-top: 18px; padding: 10px 12px;
    border: 1px solid rgba(248,81,73,.35); border-radius: 8px;
    background: rgba(248,81,73,.08); color: var(--error); font-size: 0.85em; text-align: left;
  }
  .foot { margin-top: 22px; color: var(--muted); font-size: 0.78em; line-height: 1.5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">▮</div>
    <h1>web-terminal</h1>
    <div class="sub" id="sub">Sign in to continue.</div>

    <a href="/auth/google/start" class="google-btn" id="google" hidden>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      <span>Sign in with Google</span>
    </a>

    <div class="divider" id="divider" hidden>or</div>

    <form class="pw" id="pwform" method="post" action="/auth/password" hidden>
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus />
      <button type="submit">Sign in</button>
    </form>

    <div class="err" id="err" hidden></div>
    <div class="foot" id="foot"></div>
  </div>

  <script>
    (function () {
      var cfg = /*__WT_AUTH__*/null;
      // Fallback if served statically (dev): show both so nothing is hidden.
      if (!cfg) cfg = { oauth: true, password: true, domain: "" };

      var google = document.getElementById("google");
      var pwform = document.getElementById("pwform");
      var divider = document.getElementById("divider");
      var sub = document.getElementById("sub");
      var foot = document.getElementById("foot");

      if (cfg.oauth) google.hidden = false;
      if (cfg.password) pwform.hidden = false;
      if (cfg.oauth && cfg.password) divider.hidden = false;

      if (cfg.oauth && cfg.domain) {
        sub.innerHTML = "Sign in with your <b>@" + cfg.domain + "</b> Google account.";
        foot.textContent = "Restricted to the " + cfg.domain + " Google Workspace.";
      } else if (cfg.oauth) {
        sub.textContent = "Sign in with your Google account.";
      } else {
        sub.textContent = "Enter the access password.";
      }

      var err = new URLSearchParams(location.search).get("err");
      if (err) {
        var msg = {
          state: "Session expired mid-login. Try again.",
          provider: "Google returned an error. Try again.",
          nocode: "Login was cancelled.",
          token: "Google rejected the token exchange. Try again.",
          no_id_token: "Google didn't return an id_token.",
          bad_id_token: "Malformed id_token from Google.",
          decode: "Could not decode the Google response.",
          aud: "Token audience mismatch (misconfigured client).",
          unverified: "Your Google email isn't verified.",
          domain: "This account is not allowed.",
          password: "Wrong password.",
          ratelimited: "Too many attempts. Wait a few minutes.",
          oauth_disabled: "Google sign-in is not enabled on this server.",
          internal: "Internal error. Check server logs.",
        }[err] || "Login failed. Try again.";
        var el = document.getElementById("err");
        el.textContent = msg; el.hidden = false;
      }
    })();
  </script>
</body>
</html>
